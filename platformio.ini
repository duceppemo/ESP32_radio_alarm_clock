; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s3_reversetft]
; pioarduino platform fork: tracks current Espressif Arduino core (3.x / ESP-IDF 5.x)
; ahead of the official platformio espressif32 platform.
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = adafruit_feather_esp32s3_reversetft
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
	adafruit/RTClib @ ^2.1.4
	adafruit/Adafruit VEML7700 Library @ ^2.1.6
	adafruit/Adafruit LED Backpack Library @ ^1.5.0
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit BusIO @ ^1.16.1
	pu2clr/PU2CLR SI4735 @ ^2.1.8
