; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Keeps plain `pio run`/`pio run -t upload` scoped to the firmware. `native`
; has no main() outside a test build, so building it via the default target
; would fail -- it's meant to be run explicitly with `pio test -e native`.
default_envs = adafruit_feather_esp32s3_reversetft

[env:adafruit_feather_esp32s3_reversetft]
; pioarduino platform fork: tracks current Espressif Arduino core (3.x / ESP-IDF 5.x)
; ahead of the official platformio espressif32 platform.
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = adafruit_feather_esp32s3_reversetft
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
	adafruit/RTClib @ ^2.1.4
	adafruit/Adafruit VEML7700 Library @ ^2.1.6
	adafruit/Adafruit LED Backpack Library @ ^1.5.0
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit BusIO @ ^1.16.1
	pu2clr/PU2CLR SI4735 @ ^2.1.8
	esp32async/ESPAsyncWebServer @ ^3.12.0
	esp32async/AsyncTCP @ ^3.5.0
	bblanchon/ArduinoJson @ ^7.4.1
	adafruit/Adafruit MAX1704X @ ^1.0.3
	ayushsharma82/ElegantOTA @ ^3.1.7

build_flags =
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1

; Runs on the host machine (no ESP32 hardware needed) to unit-test the
; hardware-independent logic. Only src files whose hardware dependencies
; have a fake in test/native_fakes are compiled here (RTClib, Preferences,
; SI4735, Adafruit_GFX/ST7789/MAX1704X, and the handful of Arduino
; GPIO/tone/millis calls AlarmSound and MenuSystem make) -- WebDashboard
; depends on libraries (web server/WiFi/mDNS) that aren't faked and don't
; build natively.
[env:native]
platform = native
build_src_filter =
	-<*>
	+<AlarmClock.cpp>
	+<RadioTuner.cpp>
	+<AlarmSound.cpp>
	+<WakeController.cpp>
	+<MenuSystem.cpp>
	+<BatteryMonitor.cpp>
test_build_src = true
build_flags =
	-std=gnu++17
	-Itest/native_fakes
